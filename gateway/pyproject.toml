[project]
name = "hermes-gateway"
version = "0.2.0"
description = "PACS comparison endpoints for HERMES (everything else moved to backend + proxy)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",  # used by ui/ pages to call this API and the proxy
    "python-dotenv",
    "streamlit",
    "pandas",
    "pynetdicom",
]

[tool.fastapi]
entrypoint = "main:app"
