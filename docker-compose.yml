services:

  hermes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
    volumes:
      - hermes_db:/var/lib/postgresql/data

  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Central Postgres — job/event tracking today, more HERMES-owned data later.
      # Not the anon-mapping DB (ANON_DB_*) — that's a separate, externally-owned database.
      DATABASE_URL: postgresql://hermes:hermes@hermes-db:5432/hermes
      # Anon-mapping DB (optional). Unset here → passthrough (no anonymisation),
      # appropriate for an internal-only deployment. Set these when this
      # backend is reachable from outside the secured network (via proxy/).
      # ANON_DB_HOST: <externally-owned Postgres host, reachable from this backend>
      # ANON_DB_PORT: "5432"
      # ANON_DB_NAME: <db name>
      # ANON_DB_USER: <read-only user>
      # ANON_DB_PASS: <password>
    depends_on:
      - hermes-db
    volumes:
      # Pinnacle DB (read-only host file — adjust path to match your system)
      - type: bind
        source: ./db/pinn_db.sqlite
        target: /pinn/pinn_db.sqlite
        read_only: true
      # TLS certs for Orthanc (adjust paths to match your system)
      # - type: bind
      #   source: /path/to/cert.pem
      #   target: /certs/cert.pem
      #   read_only: true
      # - type: bind
      #   source: /path/to/key.pem
      #   target: /certs/key.pem
      #   read_only: true
      # ProKnow credentials
      - type: bind
        source: ./credentials.json
        target: /app/credentials.json
        read_only: true

  streamlit:
    build: .
    command: streamlit run Home.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      # Point Streamlit at the backend service, not localhost
      BACKEND_URI: backend
      BACKEND_PORT: "8000"
    depends_on:
      - backend

volumes:
  hermes_db:
