services:

  hermes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
    volumes:
      - hermes_db:/var/lib/postgresql/data

  backend:
    image: ghcr.io/christie-scientific-computing/hermes:v0.1.3
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Central Postgres — job/event tracking today, more HERMES-owned data later.
      # Not the anon-mapping DB (ANON_DB_*) — that's a separate, externally-owned database.
      DATABASE_URL: postgresql://hermes:hermes@hermes-db:5432/hermes
      # Anon-mapping DB (optional). Unset here → passthrough (no anonymisation),
      # appropriate for an internal-only deployment. Set these when this
      # backend is reachable from outside the secured network (via proxy/).
      # ANON_DB_HOST: <externally-owned Postgres host, reachable from this backend>
      # ANON_DB_PORT: "5432"
      # ANON_DB_NAME: <db name>
      # ANON_DB_USER: <read-only user>
      # ANON_DB_PASS: <password>
    depends_on:
      - hermes-db
    volumes:
      # Pinnacle DB (read-only host file — adjust path to match your system)
      # TLS certs for Orthanc (adjust paths to match your system)
      # - type: bind
      #   source: /path/to/cert.pem
      #   target: /certs/cert.pem
      #   read_only: true
      # - type: bind
      #   source: /path/to/key.pem
      #   target: /certs/key.pem
      #   read_only: true
      # ProKnow credentials
      - type: bind
        source: ./credentials.json
        target: /app/credentials.json
        read_only: true
      - /home/topol/Certificates/Server/cht-topol_xchristie_nhs_uk.crt:/ssl/cert.crt:ro
      - /home/topol/Certificates/Server/cht-topol_xchristie_nhs_uk.key:/ssl/cert.key:ro

  worker:
    # Claims tasks from the `tasks` table and executes them
    # (docs/worker-queue-design.md) -- the same image as `backend`, just a
    # different command/entrypoint. Needs the same env/volumes as `backend`
    # since it builds Importer/Exporter/Orthanc/ProKnow clients directly,
    # the same way the API process does.
    image: ghcr.io/christie-scientific-computing/hermes:v0.1.3
    command: python -m backend.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hermes:hermes@hermes-db:5432/hermes
      # ANON_DB_HOST/PORT/NAME/USER/PASS: see `backend`'s own comment above.
    depends_on:
      - hermes-db
    volumes:
      - type: bind
        source: ./credentials.json
        target: /app/credentials.json
        read_only: true
      - /home/topol/Certificates/Server/cht-topol_xchristie_nhs_uk.crt:/ssl/cert.crt:ro
      - /home/topol/Certificates/Server/cht-topol_xchristie_nhs_uk.key:/ssl/cert.key:ro
    # Scale with `docker compose up --scale worker=3`. Start at 1: N workers
    # means N concurrent ProKnow/Orthanc/Mosaiq sessions, with no ceiling
    # enforced anywhere yet (docs/worker-queue-design.md).

  streamlit:
    image: ghcr.io/christie-scientific-computing/hermes:v0.1.3
    command: streamlit run Home.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      # Point Streamlit at the backend service, not localhost
      BACKEND_URI: backend
      BACKEND_PORT: "8000"
    depends_on:
      - backend

volumes:
  hermes_db:
