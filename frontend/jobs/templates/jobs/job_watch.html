{% extends "base.html" %}
{% block title %}Job {{ job_id }} — HERMES{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold text-gray-900 mb-1">Job in progress</h1>
<p class="text-sm text-gray-500 mb-6 font-mono">{{ job_id }}</p>

<div class="max-w-2xl">
  {% if is_combined %}
  <c-combined-job-progress job_id="{{ job_id }}" />
  {% else %}
  <c-job-progress job_id="{{ job_id }}" />
  {% endif %}
</div>
{% endblock %}
