{% extends "base.html" %}
{% block title %}Single Import — HERMES{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold text-gray-900 mb-4">Import — single patient</h1>
<div class="grid gap-6 lg:grid-cols-2">
  <div>
    {% if has_projects %}
    <form method="post" class="space-y-4 bg-white border border-gray-200 rounded-lg p-6">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label class="block text-sm font-medium text-gray-700">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}
      <button type="submit" class="rounded-md bg-hermes-700 text-white px-4 py-2 text-sm font-medium hover:bg-hermes-800">
        Import
      </button>
    </form>
    {% else %}
    <c-no-projects-notice />
    {% endif %}
  </div>

  {% if job_id %}
  <div>
    <c-job-progress job_id="{{ job_id }}" />
  </div>
  {% endif %}
</div>
{% endblock %}
