<c-vars entries="" />
<details class="border border-gray-200 rounded-md">
  <summary class="cursor-pointer px-4 py-2 text-sm font-medium text-gray-700 bg-gray-50 rounded-md">
    Full audit trail ({{ entries|length }})
  </summary>
  <table class="min-w-full divide-y divide-gray-200 text-sm">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-4 py-2 text-left font-medium text-gray-500">When</th>
        <th class="px-4 py-2 text-left font-medium text-gray-500">Who</th>
        <th class="px-4 py-2 text-left font-medium text-gray-500">Action</th>
        <th class="px-4 py-2 text-left font-medium text-gray-500">Details</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      {% for entry in entries %}
      <tr>
        <td class="px-4 py-2 whitespace-nowrap text-gray-500">{{ entry.ts }}</td>
        <td class="px-4 py-2 whitespace-nowrap text-gray-700">{{ entry.username }}</td>
        <td class="px-4 py-2 whitespace-nowrap">
          <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium
            {% if entry.action == 'approved' %}bg-green-100 text-green-800
            {% elif entry.action == 'rejected' or entry.action == 'revoked' %}bg-red-100 text-red-800
            {% elif entry.action == 'submitted' or entry.action == 'created' %}bg-blue-100 text-blue-800
            {% else %}bg-gray-100 text-gray-700{% endif %}">
            {{ entry.action }}
          </span>
        </td>
        <td class="px-4 py-2 text-gray-500">{{ entry.details|default:"" }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="px-4 py-4 text-center text-gray-400">No audit events yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</details>
