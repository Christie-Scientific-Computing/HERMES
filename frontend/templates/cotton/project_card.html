<c-vars project="" />
<a href="{% url 'research_projects:detail' project.project_id %}"
   class="block rounded-lg border border-gray-200 bg-white p-4 hover:border-hermes-300 hover:shadow-sm transition">
  <div class="flex items-start justify-between gap-2">
    <div>
      <p class="font-medium text-gray-900">{{ project.title }}</p>
      {% if project.ethics_reference %}
        <p class="text-xs text-gray-500">Ref: {{ project.ethics_reference }}</p>
      {% endif %}
    </div>
    <c-status-badge status="{{ project.status }}" />
  </div>
  <p class="mt-2 text-sm text-gray-500 line-clamp-2">{{ project.description|default:"No description." }}</p>
  <p class="mt-2 text-xs text-gray-400">Created by {{ project.created_by }}</p>
</a>
