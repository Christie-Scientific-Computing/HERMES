{% extends "base.html" %}
{% from "_form_field.html" import form_field %}
{% block title %}Change password — HERMES{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white shadow-sm border border-gray-200 rounded-lg p-8">
  <h1 class="text-lg font-semibold text-gray-900 mb-1">Change your password</h1>
  <p class="text-xs text-gray-500 mb-6">Enter your current password and choose a new one.</p>
  <form method="post" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% for field in form %}{{ form_field(field) }}{% endfor %}
    <button type="submit" class="w-full rounded-md bg-hermes-700 text-white py-2 text-sm font-medium hover:bg-hermes-800">
      Change password
    </button>
  </form>
</div>
{% endblock %}
